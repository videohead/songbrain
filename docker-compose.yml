services:
  # Hot-reloading dev server. Source is bind-mounted; node_modules stays in a volume.
  songbrain-dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - DATA_DIR=/data
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - songdata:/data
    profiles: ["dev"]

  # Production image: built assets served by the Node proxy.
  songbrain:
    build:
      context: .
      target: prod
    ports:
      - "5173:5173"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATA_DIR=/data
    volumes:
      - songdata:/data
      - ./styles:/app/styles # saved styles land in the repo
    profiles: ["prod"]

volumes:
  node_modules:
  songdata:
